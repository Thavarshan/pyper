[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyper"
version = "0.1.0"
description = "Python learning playground: progressive coding challenges solved test-first."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["challenges*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
