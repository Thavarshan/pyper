[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyper"
version = "0.1.0"
description = "Python learning playground: progressive coding challenges solved test-first."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jerome Thayananthajothy", email = "jerome@sinolanka.com" }]
keywords = ["python", "learning", "coding-challenges", "leetcode", "pytest", "algorithms", "data-structures"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Topic :: Education",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Thavarshan/pyper"
Issues = "https://github.com/Thavarshan/pyper/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["challenges*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
